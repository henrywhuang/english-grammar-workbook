<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132b2a">
  <meta name="description" content="英语语法知识大纲与 2860 道互动练习">
  <title>Grammar Atlas · 英语语法练习</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#outline" aria-label="返回大纲">
      <span class="brand-mark">G</span>
      <span><strong>Grammar Atlas</strong><small>英语语法学习地图</small></span>
    </a>
    <nav class="main-nav" aria-label="主要导航">
      <button data-view="outline" class="active">大纲</button>
      <button data-view="practice">题目</button>
      <button data-view="answers">答案</button>
    </nav>
    <button class="menu-button" type="button" aria-label="打开知识点目录" aria-expanded="false">目录</button>
  </header>

  <div class="app-shell">
    <aside class="topic-panel" id="topicPanel">
      <div class="search-wrap">
        <label for="topicSearch">查找知识点</label>
        <input id="topicSearch" type="search" placeholder="输入关键词或编号…" autocomplete="off">
      </div>
      <div class="topic-count" id="topicCount"></div>
      <div class="topic-list" id="topicList"></div>
    </aside>

    <main id="mainContent" tabindex="-1">
      <section id="outlineView" class="view active"></section>
      <section id="practiceView" class="view"></section>
      <section id="answersView" class="view"></section>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
